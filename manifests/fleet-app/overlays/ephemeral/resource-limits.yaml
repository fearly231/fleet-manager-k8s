apiVersion: v1
kind: ResourceQuota
metadata:
  name: ephemeral-namespace-quota
spec:
  hard:
    configmaps: "15"
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "15"
    requests.cpu: "2"
    requests.memory: 4Gi
    secrets: "15"
    services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ephemeral-default-limits
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
    